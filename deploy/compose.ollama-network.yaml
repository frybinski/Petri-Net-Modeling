# Also join the Docker network of Open WebUI (or Ollama), so that the server reaches it directly
# over that network instead of over the ingress. Add it to the main file:
#
#   docker compose -f compose.yaml -f compose.ollama-network.yaml up -d
#
# or set COMPOSE_FILE=compose.yaml:compose.ollama-network.yaml in .env. Needs PNM_OLLAMA_NETWORK in
# .env (find it with `docker inspect <open-webui container>`), and PNM_LLM_BASE_URL then names the
# container on that network, for example http://open-webui:8080/api.

services:
  pnm:
    networks:
      - ingress
      - ollama

networks:
  ollama:
    name: ${PNM_OLLAMA_NETWORK:?Set PNM_OLLAMA_NETWORK in .env to the Docker network of Open WebUI}
    external: true
